<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap Profile Test</title>
</head>
<body>

    <h2>Create or Edit Profile</h2>

    <form action="../backend/profil.php" method="POST">

        <label for="name">Display Name:</label>
        <input type="text" id="name" name="display_name" maxlength="100" required>

        <br><br>

        <label for="bio">Bio:</label>
        <textarea id="bio" name="bio"></textarea>

        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" maxlength="100">

        <br><br>

        <label for="email">Contact Email:</label>
        <input type="email" id="email" name="contact_email">

        <br><br>

        <button type="submit">Save Profile</button>

    </form>

</body>
</html>
