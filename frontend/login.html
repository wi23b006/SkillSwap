<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in – SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <!-- navigation -->
    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold fs-4" href="index.html"> SkillSwap</a>
            <div class="d-flex gap-4">
                <a class="nav-link" href="registrierung.html">Sign up</a>
                <a class="nav-link" href="datenschutz.html">Privacy policy</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card col-md-8 col-lg-6 col-xl-5 mx-auto">
            <div class="card-body p-4 p-md-5">

                <h1 class="h3 fw-semibold">Welcome back</h1>
                <p class="text-body-secondary mb-4">Log in to find your next skill swap.</p>

                <!-- shown after a successful registration -->
                <div id="registered" class="alert alert-success form-error" role="alert">
                    Account created! You can log in now.
                </div>

                <!-- shown when error-->
                <div id="login-error" class="alert alert-danger form-error" role="alert">
                    Invalid email or password. Please try again.
                </div>

                <!-- sends the data to the backend -->
                <form action="../backend/login.php" method="POST">

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2">Log in</button>
                </form>

                <p class="text-center text-body-secondary mt-4 mb-0">
                    New to SkillSwap? <a href="registrierung.html">Create an account</a>
                </p>

            </div>
        </div>
    </main>

</body>
</html>
